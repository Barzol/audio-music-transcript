# config.yaml
# hyperparameters for MusicNet

dataset:
  csv_file: "data/solo_piano.csv"
  data_dir: "data/raw"
  chunk_duration: 7.0       # seconds for audio chunk
  sample_rate: 22050        # Hz

model:
  input_features: 84        # bin CQT 
  dropout: 0.4
  hidden_size: 0
  lstm_layers: 0

training:
  batch_size: 12
  learning_rate: 0.002
  epochs: 25
  pos_weight: 3.0           # penalizes false negatives
  scheduler_patience: 4   
  scheduler_factor: 0.7     # LR multiplier when it is reduced
  checkpoint_path: "best_model.pt"

evaluation:
  threshold: 0.30         # sigmoid threshold

