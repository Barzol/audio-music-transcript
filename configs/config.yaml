# config.yaml
# hyperparameters for MusicNet

dataset:
  csv_file: "data/solo_piano.csv"
  data_dir: "data/raw"
  chunk_duration: 7.0       # seconds for audio chunk
  sample_rate: 22050        # Hz

model:
  input_features: 84        # bin CQT 
  dropout: 0.4

training:
  batch_size: 12

  learning_rate: 0.001
  epochs: 25

  pos_weight_pitch: 3.0
  pos_weight_onset: 25.0
  pos_weight_offset: 25.0

  loss_weight_pitch: 1.0
  loss_weight_onset: 0.05
  loss_weight_offset: 0.05

  scheduler_patience: 5
  scheduler_factor: 0.7     # LR multiplier when it is reduced
  checkpoint_path: "best_model_musicnet_phase2.pt"

evaluation:
  threshold_pitch: 0.35
  threshold_onset: 0.2
  threshold_offset: 0.2
