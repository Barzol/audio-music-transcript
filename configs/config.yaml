# config.yaml  -  MAESTRO Phase 3: CNN + BiLSTM + Multi-Output

dataset:
  csv_file: "C:/Users/david_jppxf8k/.cache/kagglehub/datasets/alonhaviv/the-maestro-dataset-v3-0-0/versions/1/maestro-v3.0.0/maestro-v3.0.0.csv"
  data_dir: "C:/Users/david_jppxf8k/.cache/kagglehub/datasets/alonhaviv/the-maestro-dataset-v3-0-0/versions/1/maestro-v3.0.0"
  chunk_duration: 7.0
  sample_rate: 22050

  # Parametri MAESTRO specifici (usati da dataset_maestro_phase3.py)
  hop_length: 512
  midi_min: 21    # A0 (MIDI 21) - range completo pianoforte
  midi_max: 108   # C8 (MIDI 108)

# Rappresentazione tempo-frequenza
# type: cqt | stft | mel
features:
  type: cqt
  hop_length: 512

  # CQT - 88 bin logaritmici, A0-C8 (range completo pianoforte)
  cqt_bins: 88

  # STFT - range pianistico ritagliato (A0=27.5 Hz, C8~4200 Hz)
  stft_n_fft: 1024
  stft_fmin: 27.5
  stft_fmax: 4200.0

  # Mel
  mel_n_fft: 2048
  mel_n_mels: 128

model:
  # multi_output: true  = allena pitch + onset + offset
  #               false = solo pitch
  multi_output: false
  dropout: 0.3
  hidden_size: 128
  lstm_layers: 1

training:
  batch_size: 8       # MAESTRO ha brani più lunghi, batch più piccolo
  epochs: 80
  learning_rate: 0.001

  pos_weight_pitch:  4.0
  pos_weight_onset:  25.0
  pos_weight_offset: 25.0

  loss_weight_pitch:  1.0
  loss_weight_onset:  0.0
  loss_weight_offset: 0.0

  scheduler_patience: 12
  scheduler_factor: 0.7
  checkpoint_path: "best_model_maestro.pt"
  grad_clip: 1.0

evaluation:
  threshold_pitch:  0.30
  threshold_onset:  0.20
  threshold_offset: 0.20

# Data Augmentation
augmentation:
  enabled: false

  pitch_shift_prob: 0.3
  pitch_shift_max_steps: 2

  detuning_prob: 0.2
  detuning_max_steps: 0.5

  gain_prob: 0.3
  gain_min: 0.5
  gain_max: 1.2

  noise_prob: 0.2
  noise_min: 0.001
  noise_max: 0.005

  reverb_prob: 0.2
  reverb_rt60_min: 0.3
  reverb_rt60_max: 1.5