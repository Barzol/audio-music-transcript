
dataset:
  csv_file: "data/solo_piano.csv"
  data_dir: "data/raw"
  chunk_duration: 7.0
  sample_rate: 22050

model:
  input_features: 84
  dropout: 0.4
  hidden_size: 0
  lstm_layers: 0

training:
  batch_size: 12
  learning_rate: 0.001
  epochs: 25
  pos_weight: 3.0
  scheduler_patience: 5   
  scheduler_factor: 0.7
  checkpoint_path: "best_model.pt"

evaluation:
  threshold: 0.35
